apply plugin: 'com.android.application'

def uploadProperties = new Properties()
def uploadPropertiesFile = rootProject.file('keystore.properties')
if (uploadPropertiesFile.exists()) {
    uploadPropertiesFile.withInputStream { uploadProperties.load(it) }
}
def uploadValue = { name, environment ->
    System.getenv(environment) ?: uploadProperties.getProperty(name)
}
def uploadStore = uploadValue('storeFile', 'ANDROID_KEYSTORE_FILE')
def uploadStorePassword = uploadValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def uploadAlias = uploadValue('keyAlias', 'ANDROID_KEY_ALIAS')
def uploadKeyPassword = uploadValue('keyPassword', 'ANDROID_KEY_PASSWORD')
def uploadConfigured = [uploadStore, uploadStorePassword, uploadAlias, uploadKeyPassword].every { it }

android {
    namespace = "com.cumorahnet.buscatumbas"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cumorahnet.buscatumbas"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "2.34.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (uploadConfigured) {
                storeFile rootProject.file(uploadStore)
                storePassword uploadStorePassword
                keyAlias uploadAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name in ['bundleRelease', 'assembleRelease', 'packageRelease', 'signReleaseBundle'] }) {
        if (!uploadConfigured) {
            throw new GradleException('Falta la firma de carga: configura android/keystore.properties o las variables ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD. No uses la clave de depuración.')
        }
        if (!rootProject.file(uploadStore).isFile()) {
            throw new GradleException('No se encuentra el archivo de la clave de carga configurada.')
        }
        if (uploadAlias == 'androiddebugkey') {
            throw new GradleException('La clave de depuración no es válida para publicar en Google Play.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
